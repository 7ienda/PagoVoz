name: Build & Release APK

# Se ejecuta automáticamente cada vez que subes cambios a la rama main,
# o manualmente desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (debug, instalable directo)
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PagoVoz.apk

      - name: Publicar como Release descargable
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "PagoVoz (última versión)"
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "PagoVoz.apk"
          body: "APK generado automáticamente desde el último commit. Descárgalo e instálalo en tu celular Android."
